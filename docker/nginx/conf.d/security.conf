# =====================================================================
#  PVModern Magento 2 — global security hardening (loaded server-wide)
# =====================================================================

server_tokens off;
client_max_body_size 64m;
client_body_timeout  60s;
client_header_timeout 30s;
send_timeout         60s;
# NOTE: keepalive_timeout and keepalive_requests are set in the default
# nginx.conf already — defining them here causes "duplicate directive".

# Gzip — Magento static assets compress very well.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
    text/plain text/css text/javascript text/xml
    application/javascript application/x-javascript application/json application/xml
    application/rss+xml image/svg+xml font/opentype font/woff font/woff2;

# Map for the HSTS header — only set on the real site, not on .local during dev.
map $sent_http_content_type $hsts_header {
    default                   "max-age=63072000; includeSubDomains; preload";
}

# Common security headers applied to every response.
add_header Strict-Transport-Security $hsts_header               always;
add_header X-Frame-Options           "SAMEORIGIN"               always;
add_header X-Content-Type-Options    "nosniff"                  always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "interest-cohort=()"       always;

# Real-IP forwarding — only trust local docker bridges.
real_ip_header   X-Forwarded-For;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
