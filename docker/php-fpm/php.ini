; ============================================================
;  PVModern Magento 2 — production PHP / OPcache tuning
; ============================================================
;  Memory limit: Magento needs 2G during indexer runs (catalog
;  reindex on a large catalog hits 1.2G in our profiling).
;  Opcache: validate_timestamps=0 because the image is immutable —
;  no reason to stat files on every request.
; ============================================================

memory_limit              = 2G
max_execution_time        = 1800
max_input_vars            = 75000
post_max_size             = 64M
upload_max_filesize       = 64M
realpath_cache_size       = 10M
realpath_cache_ttl        = 7200
expose_php                = Off
date.timezone             = Asia/Ho_Chi_Minh
; Magento writes its own session config (handler + redis host/port/db) into
; app/etc/env.php during setup:install. We do NOT set session.save_handler
; here to avoid overriding Magento's runtime resolution of REDIS_HOST/PORT.
session.gc_maxlifetime    = 86400

; --- OPcache ---
opcache.enable                = 1
opcache.enable_cli            = 1
opcache.memory_consumption    = 512
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 130000
opcache.validate_timestamps   = 0
opcache.save_comments         = 1
opcache.revalidate_freq       = 0
opcache.fast_shutdown         = 1
opcache.huge_code_pages       = 1
opcache.jit                   = tracing
opcache.jit_buffer_size       = 128M
