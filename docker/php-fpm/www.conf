; ============================================================
;  PVModern Magento 2 — php-fpm pool
; ============================================================
;  Dynamic process manager sized for a 4GB-RAM VPS. Each PHP
;  worker is ~200-400MB resident; 25 workers ≈ 6-10GB peak,
;  but most stay idle. Adjust pm.max_children per your VPS RAM.
; ============================================================

[www]
user = www-data
group = www-data
listen = 0.0.0.0:9000
; listen.allowed_clients — php-fpm only accepts a comma-separated list of
; IPv4 addresses or 'any' is NOT a valid token. The default (no value or
; commenting out) is "accept from any address". We can't restrict here in
; host-network mode because nginx looks like 127.0.0.1 / docker0 / etc.
; listen.allowed_clients = 127.0.0.1
clear_env = no

pm                      = dynamic
pm.max_children         = 25
pm.start_servers        = 4
pm.min_spare_servers    = 2
pm.max_spare_servers    = 6
pm.max_requests         = 500
pm.process_idle_timeout = 60s
pm.status_path          = /fpm-status

request_terminate_timeout = 1800
request_slowlog_timeout   = 30s
slowlog                   = /proc/self/fd/2

catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2

; Forward all environment so PVMODERN_*, SEPAY_*, MOMO_* reach PHP.
env[MAGE_MODE]           = $MAGE_MODE
env[PHP_MEMORY_LIMIT]    = $PHP_MEMORY_LIMIT
